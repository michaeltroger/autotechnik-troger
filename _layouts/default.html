<!doctype html>
<html lang="{{ site.lang | default: 'en-US' }}">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="chrome=1">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    {% seo %}
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  </head>
  <body>
    <header>
      <div class="wrapper">
        <a class="site-logo" href="{{ '/' | relative_url }}">
          <img src="{{ '/assets/images/header.png' | relative_url }}" alt="Autotechnik Troger">
        </a>
        <p>{{ site.description }}</p>

        <nav class="site-nav" aria-label="Hauptnavigation">
          <ul>
            <li><a href="{{ '/uber-uns/' | relative_url }}">Über uns</a></li>
            <li class="site-nav__dropdown">
              <a href="{{ '/ersatzteile/' | relative_url }}">Ersatzteile</a>
              <button class="site-nav__toggle" type="button" aria-label="Ersatzteile-Untermenü" aria-expanded="false" aria-controls="ersatzteile-submenu">
                <span aria-hidden="true"></span>
              </button>
              <ul class="site-nav__submenu" id="ersatzteile-submenu">
                <li><a href="{{ '/reifen-felgen/' | relative_url }}">Reifen &amp; Felgen</a></li>
                <li><a href="{{ '/batterien/' | relative_url }}">Batterien</a></li>
                <li><a href="{{ '/dampfung/' | relative_url }}">Dämpfung</a></li>
                <li><a href="{{ '/auspuffanlagen/' | relative_url }}">Auspuffanlagen</a></li>
                <li><a href="{{ '/bremsen/' | relative_url }}">Bremsen</a></li>
                <li><a href="{{ '/serviceteile/' | relative_url }}">Serviceteile</a></li>
                <li><a href="{{ '/zubehor/' | relative_url }}">Zubehör</a></li>
              </ul>
            </li>
            <li><a href="{{ '/anfahrt/' | relative_url }}">Anfahrt</a></li>
            <li><a href="{{ '/kontakt/' | relative_url }}">Kontakt</a></li>
          </ul>
        </nav>
      </div>
    </header>

    <div class="wrapper">
      <section>
        <div id="title">
          <h1>{{ page.title | default: site.title }}</h1>
        </div>
        <div id="main-content">
          {{ content }}
        </div>
        <footer>
          <p><a href="{{ '/impressum/' | relative_url }}">Impressum</a></p>
        </footer>
      </section>
    </div>
    <script>
      const ersatzteileDropdown = document.querySelector('.site-nav__dropdown');
      const ersatzteileToggle = document.querySelector('.site-nav__toggle');

      ersatzteileToggle.addEventListener('click', () => {
        const isOpen = ersatzteileDropdown.classList.toggle('is-open');
        ersatzteileToggle.setAttribute('aria-expanded', isOpen);
      });

      document.addEventListener('click', (event) => {
        if (!ersatzteileDropdown.contains(event.target)) {
          ersatzteileDropdown.classList.remove('is-open');
          ersatzteileToggle.setAttribute('aria-expanded', 'false');
        }
      });

      document.addEventListener('keydown', (event) => {
        const focusIsInDropdown = ersatzteileDropdown.contains(document.activeElement);

        if (event.key === 'Escape' && (ersatzteileDropdown.classList.contains('is-open') || focusIsInDropdown)) {
          ersatzteileDropdown.classList.remove('is-open');
          ersatzteileToggle.setAttribute('aria-expanded', 'false');

          if (focusIsInDropdown) {
            ersatzteileDropdown.nextElementSibling.querySelector('a').focus();
          }
        }
      });

      const imageLightbox = document.createElement('div');
      imageLightbox.className = 'image-lightbox';
      imageLightbox.setAttribute('role', 'dialog');
      imageLightbox.setAttribute('aria-modal', 'true');
      imageLightbox.setAttribute('aria-label', 'Anzeige vergrößert');
      imageLightbox.setAttribute('aria-hidden', 'true');
      imageLightbox.setAttribute('tabindex', '-1');

      const lightboxImage = document.createElement('img');
      lightboxImage.className = 'image-lightbox__image';
      imageLightbox.appendChild(lightboxImage);
      document.body.appendChild(imageLightbox);

      let activeImageButton = null;

      const closeImageLightbox = () => {
        if (!activeImageButton) {
          return;
        }

        imageLightbox.classList.remove('is-open');
        imageLightbox.setAttribute('aria-hidden', 'true');
        document.body.classList.remove('image-lightbox-open');
        activeImageButton.setAttribute('aria-expanded', 'false');
        activeImageButton.setAttribute('aria-label', 'Anzeige vergrößern');
        activeImageButton.focus();
        activeImageButton = null;
      };

      document.querySelectorAll('.click-to-enlarge').forEach((imageButton) => {
        imageButton.setAttribute('aria-expanded', 'false');
        imageButton.addEventListener('click', () => {
          if (activeImageButton) {
            closeImageLightbox();
            return;
          }

          activeImageButton = imageButton;
          lightboxImage.src = imageButton.querySelector('img').src;
          lightboxImage.alt = imageButton.querySelector('img').alt;
          imageLightbox.setAttribute('aria-hidden', 'false');
          imageLightbox.classList.add('is-open');
          document.body.classList.add('image-lightbox-open');
          imageButton.setAttribute('aria-expanded', 'true');
          imageButton.setAttribute('aria-label', 'Anzeige verkleinern');
          imageLightbox.focus();
        });
      });

      imageLightbox.addEventListener('click', (event) => {
        if (event.target === imageLightbox || event.target === lightboxImage) {
          closeImageLightbox();
        }
      });

      document.addEventListener('keydown', (event) => {
        if (!activeImageButton) {
          return;
        }

        if (event.key === 'Escape') {
          closeImageLightbox();
        } else if (event.key === 'Tab') {
          event.preventDefault();
          imageLightbox.focus();
        }
      });
    </script>
  </body>
</html>
